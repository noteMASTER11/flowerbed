name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shellcheck
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate manifest XML
        run: xmllint --noout manifests/fleur-lineage-23.2.xml
      - name: Validate shell scripts
        run: |
          bash -n scripts/ubuntu/*.sh scripts/ubuntu/lib/*.sh
          shellcheck scripts/ubuntu/*.sh scripts/ubuntu/lib/*.sh
      - name: Verify generated provenance is current
        run: |
          temporary="$(mktemp)"
          python3 scripts/render_provenance.py \
            sources/provenance.json \
            --firmware sources/firmware.json \
            --output "$temporary"
          diff -u docs/source-provenance.md "$temporary"
